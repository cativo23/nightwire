services:
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile.dev
    ports:
      - "3001:5173"
    volumes:
      - ./apps/docs/src:/app/apps/docs/src
      - ./apps/docs/index.html:/app/apps/docs/index.html
      - ./apps/docs/public:/app/apps/docs/public
      - ./examples:/app/examples
      - ./nightwire.css:/app/nightwire.css
      - ./tailwind.preset.js:/app/tailwind.preset.js
      - ./src/tokens/tokens.json:/app/src/tokens/tokens.json
    restart: unless-stopped
